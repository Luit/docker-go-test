---
name: Container image build

on:
  push:
    branches:
      - main
    tags:
      - v[0-9]+.[0-9]+.[0-9]+
  pull_request:
    branches:
      - main

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      meta-images: ${{ steps.images.outputs.images }}
    steps:
      - id: images
        run: |
          echo 'images<<EOF' >> $GITHUB_OUTPUT
          if ${{ startsWith(github.ref, 'refs/tags/v') }}; then
            echo "ghcr.io/luit/docker-go-test-prod" >> $GITHUB_OUTPUT
          fi
          echo "ghcr.io/luit/docker-go-test" >> $GITHUB_OUTPUT
          echo 'EOF' >> $GITHUB_OUTPUT
  build:
    needs: prepare
    uses: docker/github-builder/.github/workflows/build.yml@v1
    permissions:
      contents: read # to fetch the repository content
      id-token: write # for signing attestations and cache entries with GitHub OIDC
      packages: write
    with:
      output: image
      platforms: linux/amd64,linux/arm64
      build-args: |
        BUILDKIT_CONTEXT_KEEP_GIT_DIR=1
      push: ${{ github.event_name != 'pull_request' }}
      sbom: ${{ github.event_name != 'pull_request' }}
      sign: ${{ github.event_name != 'pull_request' }}
      meta-flavor: |
        latest=false
      meta-images: ${{ needs.prepare.outputs.meta-images }}
      meta-tags: |
        type=ref,event=branch
        type=ref,event=pr
        type=semver,pattern={{version}}
        type=semver,pattern={{major}}.{{minor}}
    secrets:
      registry-auths: |
        - registry: https://ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
